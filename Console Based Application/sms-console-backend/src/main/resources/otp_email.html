<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Password Reset OTP</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 30px;">
  <div style="max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h2 style="color: #2c3e50; margin-bottom: 4px;">School Management System</h2>
    <hr style="border: none; border-top: 1px solid #eee; margin-bottom: 24px;">
    <p style="color: #555;">Hello <strong>{{userName}}</strong>,</p>
    <p style="color: #555;">You requested a password reset. Use the OTP below to proceed:</p>
    <div style="text-align: center; margin: 28px 0;">
      <span style="font-size: 36px; font-weight: bold; letter-spacing: 10px; color: #2980b9; background: #eaf4fb; padding: 12px 24px; border-radius: 6px;">{{otp}}</span>
    </div>
    <p style="color: #555;">This OTP is valid for <strong>5 minutes</strong>. Do not share it with anyone.</p>
    <p style="color: #888; font-size: 12px; margin-top: 24px;">If you did not request a password reset, you can safely ignore this email.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin-top: 24px;">
    <p style="color: #aaa; font-size: 11px; text-align: center;">© 2026 School Management System</p>
  </div>
</body>
</html>
